<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150" width="1000" height="1150">
  <!--
    Butler sitting in a brass porthole, for the overlay. Each <g class="layer"> is rendered alone into its own PNG by
    ./default.nix, so the overlay can animate it: the figure's layers are clipped by `mask`, the porthole's inside
    and everything above its centre line, so his head and shoulders rise over the rim while below the waist the rim
    cuts him off. `back` holds the porthole and its upper rim, behind him, and `rim` its lower rim, in front. Drawn after jimbo's butler-card.js.
  -->
  <defs>
    <radialGradient id="sphere" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#43b8b5"/>
      <stop offset="0.5" stop-color="#1a8789"/>
      <stop offset="1" stop-color="#0a4449"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dc8c"/>
      <stop offset="1" stop-color="#b8923a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e6a4"/>
      <stop offset="0.55" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#8c6a22"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26343e"/>
      <stop offset="1" stop-color="#0d1318"/>
    </linearGradient>
    <radialGradient id="room" cx="42%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff8e4"/>
      <stop offset="0.6" stop-color="#f1e2b8"/>
      <stop offset="1" stop-color="#d8bf82"/>
    </radialGradient>
    <clipPath id="inside"><circle cx="500" cy="820" r="296"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <g id="back" class="layer">
    <circle cx="500" cy="834" r="300" fill="#000" fill-opacity="0.32" filter="url(#soft)"/>
    <circle cx="500" cy="820" r="296" fill="url(#room)"/>
    <g clip-path="url(#inside)" fill="#ffffff">
      <path d="M300 520 L420 520 L330 1130 L190 1070 Z" fill-opacity="0.22"/>
      <path d="M470 520 L540 520 L470 1130 L400 1130 Z" fill-opacity="0.14"/>
    </g>
    <circle cx="500" cy="820" r="296" fill="none" stroke="url(#rim)" stroke-width="30"/>
    <circle cx="500" cy="820" r="280" fill="none" stroke="#6e5418" stroke-opacity="0.45" stroke-width="4"/>
    <g fill="#fff3c4" stroke="#8c6a22" stroke-width="4">
      <circle cx="291" cy="611" r="7"/>
      <circle cx="500" cy="524" r="7"/>
      <circle cx="709" cy="611" r="7"/>
    </g>
  </g>

  <g id="mask" class="layer">
    <rect x="0" y="0" width="1000" height="820" fill="#fff"/>
    <circle cx="500" cy="820" r="288" fill="#fff"/>
  </g>

  <g id="body" class="layer">
    <path d="M320 600 Q284 830 330 1022" fill="none" stroke="#141c22" stroke-width="80" stroke-linecap="round"/>
    <path d="M680 600 Q716 830 670 1022" fill="none" stroke="#141c22" stroke-width="80" stroke-linecap="round"/>
    <path d="M500 500 L384 522 Q322 546 308 630 L304 820 L336 1150 L664 1150 L696 820 L692 630 Q678 546 616 522 Z" fill="url(#cloth)" stroke="#7fd6d0" stroke-opacity="0.25" stroke-width="5"/>
    <path d="M500 1060 L432 520 L568 520 Z" fill="#f5efe0"/>
    <path d="M432 520 L396 542 L452 700 L420 722 L500 1050 Z M568 520 L604 542 L548 700 L580 722 L500 1050 Z" fill="#253540"/>
    <circle cx="500" cy="700" r="12" fill="#17222b"/>
    <circle cx="500" cy="776" r="12" fill="#17222b"/>
    <circle cx="500" cy="852" r="12" fill="#17222b"/>
    <path d="M446 530 L446 490 Q500 476 554 490 L554 530 Z" fill="#f5efe0"/>
  </g>

  <g id="head" class="layer">
    <circle cx="500" cy="300" r="210" fill="url(#sphere)"/>
    <ellipse cx="416" cy="170" rx="84" ry="43" transform="rotate(-28 416 170)" fill="url(#shine)"/>
    <g transform="translate(500 300) scale(0.5355) translate(-512 -452)">
      <path d="M596 452 Q566 510 606 534 Q646 552 664 520 Q684 492 712 528 Q742 590 752 700" fill="none" stroke="url(#brass)" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 19"/>
      <circle cx="632" cy="368" r="86" fill="#f5efe0" fill-opacity="0.22" stroke="url(#brass)" stroke-width="30"/>
      <path d="M590 334 Q606 314 634 312" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    </g>
  </g>

  <g id="eye" class="layer">
    <g transform="translate(500 300) scale(0.5355) translate(-512 -452)">
      <path d="M344 404 L452 404" fill="none" stroke="#f5efe0" stroke-width="30" stroke-linecap="round"/>
    </g>
  </g>

  <g id="pupil" class="layer">
    <g transform="translate(500 300) scale(0.5355) translate(-512 -452)">
      <circle cx="632" cy="376" r="24" fill="#f5efe0"/>
    </g>
  </g>

  <g id="brows" class="layer">
    <g transform="translate(500 300) scale(0.5355) translate(-512 -452)" fill="none" stroke="#f5efe0" stroke-width="44" stroke-linecap="round">
      <path d="M316 336 Q404 290 476 322"/>
      <path d="M548 256 Q634 176 718 230"/>
    </g>
  </g>

  <g id="bow" class="layer">
    <g transform="translate(500 522) scale(0.46) translate(-512 -622)">
      <path d="M512 622 L264 506 Q224 622 264 738 Z M512 622 L760 506 Q800 622 760 738 Z" fill="url(#brass)" stroke="#17222b" stroke-width="20" stroke-linejoin="round"/>
      <path d="M318 572 L420 610 M318 672 L420 634 M706 572 L604 610 M706 672 L604 634" stroke="#8c6a22" stroke-width="18" stroke-linecap="round"/>
      <rect x="458" y="566" width="108" height="112" rx="28" fill="url(#brass)" stroke="#17222b" stroke-width="20"/>
      <path d="M482 596 Q500 586 520 588" fill="none" stroke="#fff6d8" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

  <g id="rim" class="layer">
    <path d="M204 820 A296 296 0 0 0 796 820" fill="none" stroke="url(#rim)" stroke-width="30"/>
    <path d="M220 820 A280 280 0 0 0 780 820" fill="none" stroke="#6e5418" stroke-opacity="0.45" stroke-width="4"/>
    <path d="M189 820 A311 311 0 0 0 811 820" fill="none" stroke="#6e5418" stroke-opacity="0.35" stroke-width="3"/>
    <g fill="#fff3c4" stroke="#8c6a22" stroke-width="4">
      <circle cx="796" cy="820" r="7"/>
      <circle cx="709" cy="1029" r="7"/>
      <circle cx="500" cy="1116" r="7"/>
      <circle cx="291" cy="1029" r="7"/>
      <circle cx="204" cy="820" r="7"/>
    </g>
  </g>

  <g id="hand-left" class="layer">
    <g transform="translate(336 1046) rotate(-10) scale(0.85)">
      <rect x="-56" y="-62" width="112" height="34" rx="14" fill="#f5efe0" stroke="#c9bfa8" stroke-width="5"/>
      <path d="M-50 -30 Q-58 30 -20 44 Q20 54 50 30 Q60 -6 50 -30 Z" fill="#fbf8f0" stroke="#c9bfa8" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-24 -4 L-24 38 M0 -4 L0 46 M24 -4 L24 40" stroke="#d6ccb4" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <g id="hand-right" class="layer">
    <g transform="translate(664 1046) rotate(10) scale(0.85)">
      <rect x="-56" y="-62" width="112" height="34" rx="14" fill="#f5efe0" stroke="#c9bfa8" stroke-width="5"/>
      <path d="M-50 -30 Q-60 -6 -50 30 Q-20 54 20 44 Q58 30 50 -30 Z" fill="#fbf8f0" stroke="#c9bfa8" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-24 -4 L-24 40 M0 -4 L0 46 M24 -4 L24 38" stroke="#d6ccb4" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
